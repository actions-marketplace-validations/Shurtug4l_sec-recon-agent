name: backend

on:
  # Path filters on push avoid burning CI minutes on docs-only commits
  # landing through merges. On pull_request we run unconditionally because
  # the branch-protection rule makes this workflow a required check, and a
  # required check that never runs would block any docs-only PR (the
  # check sits in 'expected, pending' forever).
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid burning credits on stacked pushes to the same PR.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aggregator that the branch-protection "Require status checks to
  # pass" rule points at. It depends on every matrix entry of the
  # `matrix-test` job and fails fast when any entry fails. Keeping the
  # original "lint + type-check + tests" name avoids re-pointing the
  # protection rule every time the matrix grows.
  lint-and-test:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    needs: matrix-test
    if: always()
    steps:
      - name: Fail if any matrix entry failed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "matrix-test result was '${{ needs.matrix-test.result }}' — failing aggregator."
            exit 1
          fi
          echo "matrix-test passed across every Python version."

  matrix-test:
    name: lint + type-check + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      # Confirms the declared `requires-python = ">=3.12"` actually holds.
      # 3.14 is here because the runtime images are built on python:3.14-slim:
      # without it, the only interpreter that ships to users is the one the
      # suite never runs on. It was excluded while a few transitive deps had
      # no 3.14 wheels; dropping the unused pydantic-ai provider extras took
      # 48 packages out of the lock and with them that constraint.
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          # 0.5.x predates the 3.14.0 release, so its interpreter registry tops
          # out at an alpha: `uv python install 3.14` silently handed CI
          # cpython-3.14.0a5 and pydantic-core segfaulted against that ABI. The
          # matrix entry would have been testing an interpreter nobody runs
          # while the images ship 3.14 stable. The other two workflows already
          # float uv via setup-uv's default; this one was the outlier.
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts

      # Once, not per entry. `python_version = "3.12"` in pyproject pins the
      # semantics mypy analyzes against, so every matrix entry would produce
      # the identical result: only the interpreter RUNNING mypy differs, which
      # is a mypy packaging concern and not a property of this codebase. It is
      # not hypothetical either - mypy 2.1.0's mypyc-compiled wheel segfaults
      # (exit 139) under CPython 3.14 on linux-x86_64, so a per-entry run would
      # fail the matrix on the type checker's own runtime while the code it
      # type-checks is fine. Pinned to the lowest entry, which is also the
      # declared analysis target.
      - name: Type check (mypy --strict)
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} mypy src scripts

      # Skip @pytest.mark.slow (ChromaDB roundtrip + ONNX model load),
      # which is too long to run on every PR. The full suite runs locally
      # and end-to-end smoke happens via `make up` against a live stack.
      - name: Tests (fast subset + coverage)
        run: uv run --python ${{ matrix.python-version }} pytest -m "not slow" --cov --cov-report=term -q
