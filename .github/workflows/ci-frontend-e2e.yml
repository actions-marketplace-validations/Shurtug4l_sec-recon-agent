name: frontend-e2e

# P12 completeness gate. Builds the keyless static demo under the Pages base path,
# then runs the two browser-free link gates (dead cross-link detection rides the
# gen-docs step inside build:demo; unresolved-href detection is check:links) plus
# the axe + horizontal-overflow sweep against the real export. This is a blocking
# PR check: a dead cross-link, an unresolved href, or an a11y/overflow regression
# fails here instead of reaching the live Pages site. The P6-class failures (a nav
# link surviving a route rename, a header overflowing a mid-width band) shipped
# precisely because these checks were a manual pre-push ritual, not a gate.
#
# Two modes, one job (the required-check name must not change):
# - pull_request: sweep tooling pinned exact. A required check that floats on
#   upstream releases lets a third party block every merge. axe-core 4.13
#   (2026-08-11) started resolving backgrounds through positioned siblings and
#   flagged a real contrast bug; the finding was right, the delivery was not:
#   every PR went red, backend-only ones included, and the Dependabot
#   auto-merge queue sat blocked for six weeks with criticals in it.
# - schedule / dispatch: the same sweep on floating majors against main. Drift
#   shows up as one red run on main, where it blocks nothing. When it is green
#   on a newer release, move the pins below (Dependabot cannot see them).
on:
  pull_request:
    branches: [main]
  schedule:
    # Monday 07:30 UTC, after docker-scan (06:30) and sbom-gate (07:00).
    - cron: "30 7 * * 1"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-verify:
    name: export + completeness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      # Scope routes + assets under the project Pages sub-path, so the export and
      # the sweep's static server mirror https://<user>.github.io/<repo>/ exactly.
      NEXT_PUBLIC_BASE_PATH: /sec-recon-agent
      # Pinned for the required PR check, floating for the drift canary. The
      # Chromium build follows the Playwright version, so the pin covers it too.
      SWEEP_TOOLING: >-
        ${{ github.event_name == 'pull_request'
        && 'playwright@1.63.0 @axe-core/playwright@4.13.0'
        || 'playwright@1 @axe-core/playwright@4' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright (ephemeral, not a package.json dep)
        # The browser binary is heavy and the other frontend jobs must stay lean,
        # so the sweep's deps live only here (--no-save), never in the lockfile.
        # Versions come from SWEEP_TOOLING (see the header). Unquoted on purpose:
        # it is a space-separated package list.
        run: |
          # shellcheck disable=SC2086
          npm i --no-save --no-audit --no-fund --legacy-peer-deps $SWEEP_TOOLING
          npx playwright install --with-deps chromium

      - name: Build static demo export
        # Runs gen-docs first, which enforces the dead-cross-link gate (a renamed
        # heading or a typo'd anchor throws here before the export is written).
        run: npm run build:demo

      - name: Check exported links
        run: npm run check:links

      - name: Accessibility + overflow sweep
        run: npm run a11y:sweep

  # Scheduled runs block nothing, so a red one is easy to miss. This turns the
  # result into an issue (opened on failure, closed on the next green run).
  report:
    name: report scheduled result
    needs: export-and-verify
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/report-scheduled-result.yml
    with:
      result: ${{ needs.export-and-verify.result }}
