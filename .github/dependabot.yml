# Dependabot keeps every dependency ecosystem we ship aligned with upstream
# security fixes.
#
# Cadence is split on purpose. VERSION updates run monthly: they are hygiene,
# and a weekly drip multiplies the occasions to babysit a batch without
# shortening any exposure window. SECURITY updates ignore `schedule` entirely
# and arrive as soon as an advisory lands, so the CVE window is governed by
# GitHub, not by this file. (The earlier comment here defended weekly on
# CVE-window grounds; that argument never applied to version updates.)
#
# Every ecosystem declares TWO groups. `groups` applies to version updates
# ONLY unless `applies-to: security-updates` is set, so without the second
# group a security bump arrives as its own PR alongside the version batch,
# both touching the same lockfile. That is not theoretical: on 2026-07-28 a
# solo `next` security PR and the npm group PR collided, and Dependabot closed
# and RECREATED the group rather than rebasing it.
#
# `cooldown` suppresses the churn of versions superseded within days (`next`
# 15.5.21 was replaced by 15.5.22 in under 24 hours, after costing a PR).
# The per-semver cooldown keys exist only where the ecosystem has semver
# (pip, npm). docker, github-actions and pre-commit take `default-days` alone:
# `semver-major-days` there is a PARSE ERROR, and a config that fails to parse
# stops version updates for every ecosystem, silently. Observed on 2026-09-21:
# the 04:17 scheduled batch still ran with the key in place, a manual "Check
# for updates" the same evening was rejected with exactly this error. Majors
# in those ecosystems stay manual anyway (auto-merge policy below), so the
# longer major cooldown bought nothing there.
#
# Auto-merge lives in .github/workflows/dependabot-auto-merge.yml: patch and
# minor only, never the schema-emitting set (pydantic-ai, pydantic-ai-slim,
# pydantic-settings, fastapi, mcp) whose bumps can trip the record-replay
# cassette gate. Majors always stay manual.

version: 2

updates:
  # Python deps: uv-managed but Dependabot reads pyproject + uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-major-days: 30
    groups:
      python-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # Majors that are capped in pyproject.toml on purpose. For a capped
    # requirement Dependabot proposes WIDENING THE CAP, and that PR touches
    # pyproject.toml only: uv.lock still pins 1.x, so every check is green while
    # the protection is removed. The next `uv lock` then resolves the new major
    # and breaks main (mcp 2.x has no FastMCP; pydantic-ai 1.x code against 2.x).
    # The auto-merge policy already holds these as majors in the guarded set;
    # this stops the monthly green-but-wrong PR from existing at all. Each entry
    # goes when its migration lands: mcp #236, pydantic-ai-slim #237.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-ai-slim"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps-py)"

  # Frontend deps.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-major-days: 30
    groups:
      npm-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # eslint-config-next and typescript are tightly coupled to Next.js's
    # major: bumping them independently lands in CI red until Next itself
    # moves. Skip the major bump for both; minor/patch still come through.
    # Same logic for next itself: its major bump is a deliberate
    # decision that needs the surrounding ecosystem moved together.
    # eslint follows the same constraint: eslint-config-next patches eslint
    # through @rushstack/eslint-patch, which only recognises the eslint major
    # it was built against. A solo eslint major (e.g. 9 -> 10) breaks
    # `eslint .` at load time until eslint-config-next ships matching support.
    # tailwindcss major is the same shape: v4 is a CSS-first rewrite that drops
    # the `tailwind.config.ts` model this project uses. A solo v3 -> v4 bump
    # breaks the build until the config and theme tokens are migrated by hand.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps-js)"

  # Container base images (python:3.14-slim, node:22-alpine).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker-backend-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-backend-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker-frontend-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    # Node.js uses even majors as LTS and odd majors as current. Skip
    # the auto-major bump so Dependabot does not propose node 23/25/27
    # (non-LTS) — we move to the next LTS manually when it has been GA
    # for at least six months. Minor + patch always flow.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker)"

  # CI actions: the actions/* family has had supply-chain incidents
  # in the past; pinning + auto-updating is the right discipline.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps-ci)"

  # Pre-commit hooks: the ruff-pre-commit pin must track the ruff
  # version we declare in pyproject so the hook understands every
  # rule selector we use. A stale pin produces a TOML parse error
  # that pre-commit reports as "Failed" between two "Passed" lines
  # and is easy to miss — that bit us once already.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      precommit-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      precommit-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps-precommit)"
