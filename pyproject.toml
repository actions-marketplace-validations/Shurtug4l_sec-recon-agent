[project]
name = "sec-recon-agent"
version = "0.1.4"
description = "Type-safe security triage agent built on Pydantic AI and a custom MCP server"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Simone La Porta", email = "slaporta94@gmail.com" },
]
keywords = ["pydantic-ai", "mcp", "cve", "security", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.9.0",
    # Slim + explicit extras, not the `pydantic-ai` umbrella: that meta-package
    # pulls pydantic-ai-slim with ALL 20 provider extras, so the runtime image
    # shipped nine unused model SDKs plus temporalio's Rust bridge (2 HIGH
    # advisories in the weekly Trivy scan, on code this agent never calls).
    # Anthropic is the only provider in ALLOWED_MODELS; `mcp` backs
    # pydantic_ai.mcp.MCPToolset. Adding a provider means adding its extra here.
    # Floor: 1.106.0 is the min-patched 1.x (GHSA-h7p7-w5gc-xj3w, unvalidated
    # UploadedFile references in the UI adapters; before it CVE-2026-48782,
    # fixed in 1.102.0), but the floor sits at 1.107.6 because it is the first
    # 1.x that declares `anthropic<1`. Every earlier 1.x leaves the SDK
    # unbounded, a fresh resolve then picks anthropic 1.x, and that SDK rejects
    # the httpx.AsyncClient pydantic-ai hands it: TypeError at agent
    # construction. The `<2` cap is the within-major pinning decision made
    # explicit: lock, tests and cassettes are all built on 1.x, upstream is at
    # 2.46, and without the cap an unlocked install ran 2.x for weeks unnoticed.
    # Floor at 1.107.7: earlier 1.x releases are affected by the nested-HTML
    # resource exhaustion in local web fetching (CVE-2026-107287).
    "pydantic-ai-slim[anthropic,mcp]>=1.107.7,<2",
    # The old >=2.6.0 floor spanned the 2.12.0-2.14.1 window affected by
    # CVE-2026-58203 (NestedSecretsSettingsSource follows symlinks out of the
    # secrets dir). Floor moved to the fixed release, where the lock already sat.
    "pydantic-settings>=2.14.2",
    # Capped below 2: mcp 2.0 renamed FastMCP to MCPServer and mcp_server/ is
    # written against the 1.x API. Without the cap any unlocked install (the
    # gate action before it read uv.lock, a plain `pip install`) resolves 2.x
    # and dies at import. Lift it with the 2.x migration, not before.
    # Floor at 1.30.0: earlier releases accumulate StreamableHTTP sessions
    # without bound (CVE-2026-59951).
    "mcp>=1.30.0,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "defusedxml>=0.7.1",
    "chromadb>=0.5.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "slowapi>=0.1.9",
    "cvss>=3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "hypothesis>=6.100.0",
    "types-defusedxml>=0.7.0",
    "pre-commit>=4.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
sec-recon-mcp = "sec_recon_agent.mcp_server.server:main"
sec-recon-api = "sec_recon_agent.api.stream:main"
sec-recon-seed = "sec_recon_agent.mcp_server.tools.cve_search:seed_index"
sec-recon-eval = "sec_recon_agent.eval.cli:main"
sec-recon-export = "sec_recon_agent.export.cli:main"
sec-recon-gate = "sec_recon_agent.gate.cli:main"
sec-recon-scorecard = "sec_recon_agent.eval.scorecard:main"
sec-recon-audit = "sec_recon_agent.audit.cli:main"
sec-recon-redteam = "sec_recon_agent.redteam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_recon_agent"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The cvss package (RedHatProductSecurity) ships no py.typed marker; scores
# come back as Any and are range-checked at the gate/severity.py boundary.
module = "cvss.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyyaml (dev extra) is only read by scripts/gen_atlas_vocab.py, a maintainer
# tool; an override avoids adding a stub package to the lock for one import.
module = "yaml.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "A", "C4", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on Depends() / Security() / Header() being called in
# parameter defaults; that is the documented usage. Whitelist them so
# B008 does not flag every endpoint.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
# Adversarial corpus contains intentional Unicode homoglyphs (Cyrillic С,
# full-width hyphens, etc.) used to verify the boundary regex rejects them.
"tests/property/test_adversarial.py" = ["S", "ASYNC", "RUF001", "RUF003"]
# The capture script posts to the fixed localhost dev endpoint; S310 wants
# the scheme audited on a URL that is a module constant. A trailing
# `# noqa: S310` is stripped by one ruff version and required by the other
# (the pre-commit rev and the uv-pinned one disagree on the reported line),
# so the ignore lives here, where both agree.
"scripts/capture_fixtures.py" = ["S310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that load the sentence-transformer model or hit ChromaDB; can be skipped via `pytest -m 'not slow'`",
]
filterwarnings = [
    # asyncio.iscoroutinefunction is deprecated on Python 3.14 (removal in 3.16);
    # the call comes from starlette/fastapi routing, not from this codebase.
    # Scoped to the exact message so genuine DeprecationWarnings still surface.
    # Remove once the pinned upstreams move to inspect.iscoroutinefunction.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # uvicorn still imports websockets' legacy server protocol at startup; the
    # live MCP auth tests (tests/mcp_server/test_auth.py) start a real uvicorn
    # on a loopback socket, so the import runs inside the suite. Two exact
    # messages, both raised from site-packages, none from this codebase.
    # Remove once the pinned uvicorn drops websockets.legacy.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["sec_recon_agent"]
branch = true
# Skip code paths that only run under a live LLM or live MCP transport;
# they are exercised by the manual eval/redteam suites, not the fast lane.
omit = [
    "src/sec_recon_agent/agent/triage.py",       # needs Anthropic key + MCP server
    "src/sec_recon_agent/mcp_server/server.py",  # FastMCP boot
    "src/sec_recon_agent/eval/cli.py",           # CLI shell
    "src/sec_recon_agent/eval/runner.py",        # HTTP client against a live stack
    "src/sec_recon_agent/eval/retrieval.py",     # in-process against a live seeded ChromaDB index
    "src/sec_recon_agent/redteam/cli.py",
    "src/sec_recon_agent/audit/cli.py",
    "src/sec_recon_agent/export/cli.py",         # CLI shell; the renderers underneath are unit-tested
    "src/sec_recon_agent/gate/cli.py",           # CLI shell; runner/render underneath are unit-tested
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
# Soft floor: keeps a regression from silently dropping coverage.
fail_under = 70
